services:
  db:
    image: postgis/postgis:16-3.5
    platform: linux/amd64
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - PGSERVICEFILE=/.pg_service.conf
    ports:
      # making the postgres database accessible for debugging
      - ${PG_CONTAINER_PORT:-5432}:5432
    volumes:
      # use the PGSERVICE to connect to a database from outside the container
      - ${PGSERVICEFILE:-./datamodel/.docker/.pg_service.conf}:/.pg_service.conf:ro
      - dump-data:/dump
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Probe TCP, not the socket: while initdb runs, the entrypoint starts a
      # temporary server with listen_addresses='' that answers on the socket only.
      # A socket probe reports "accepting connections" moments before that server
      # is shut down to hand over to the real one.
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 45

  pum:
    image: opengisch/pum:${PUM_VERSION:-latest}
    tty: true
    stdin_open: true
    platform: linux/amd64
    environment:
      - PGSERVICE=${PGSERVICE:-pg_signalo}
    volumes:
      - .:/pum
      - ${PGSERVICEFILE:-./datamodel/.docker/.pg_service.conf}:/.pg_service.conf:ro
    depends_on:
      db:
        condition: service_healthy

  qgis:
    # qgis/qgis plus the QField packaging dependency -- see docker/qgis/Dockerfile.
    # Bumping the pin in docker/qgis/requirements.txt needs a `--build` to take effect.
    build:
      context: docker/qgis
      args:
        QGIS_VERSION: ${QGIS_VERSION:-3.44}
    platform: linux/amd64
    tty: true
    environment:
      - PGSERVICEFILE=/.pg_service.conf
    volumes:
      - .:/usr/src
      - ${PGSERVICEFILE:-./datamodel/.docker/.pg_service.conf}:/.pg_service.conf:ro
    links:
      - db
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - qgis

  schemaspy:
    image: schemaspy/schemaspy
    platform: linux/amd64
    volumes:
      - ./datamodel/schemaspy:/output
      - ./datamodel/schemaspy.properties:/schemaspy.properties
    depends_on:
      db:
        condition: service_healthy
    network_mode: "service:db"
    command: [
      "-configFile",
      "/schemaspy.properties"
    ]
    user: "${UID}:${GID}"
    profiles:
      - schemaspy

volumes:
  db-data:
  dump-data:
