name: 📦 Package project for QField

concurrency:
  group: qfield-package-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

on:
  pull_request:
    branches:
      - main
    paths:
      - project/signalo.qgs
      - project/virtual_layers/**
      - project/scripts/**
      - docker/qgis/**
      - datamodel/**
      - '.github/workflows/qfield-package.yml'
  workflow_dispatch:
  workflow_call: # Allows this workflow to be called by other workflows
    inputs:
      release_tag:
        required: false
        description: 'Release tag to upload the QField package as a GitHub Release asset'
        default: ''
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package and verify the QField project
    runs-on: ubuntu-latest
    env:
      PGSERVICE: pg_signalo
      DB_NAME: signalo
      DEMO_DATA: Lausanne
      COMPOSE_PROFILES: qgis
      COMPOSE_PROJECT_NAME: signalo
    steps:
      - uses: actions/checkout@v7

      - name: Setup env
        run: cp .env.example .env

      - name: Initialize container
        run: |
          docker compose up -d --build
          until docker compose exec db pg_isready -h localhost -U postgres; do
            echo "Waiting for PostgreSQL to be ready..."
            sleep 3
          done
          docker compose exec db createdb -U postgres ${DB_NAME}
          # Demo data matters here: packaging an empty database would produce a package
          # that passes every structural check while proving nothing about the symbology.
          docker compose run pum -vvv -p ${PGSERVICE} -d datamodel install -p SRID 2056 --demo-data ${DEMO_DATA}

      - name: Package for QField
        run: |
          docker compose run --rm -e QT_QPA_PLATFORM=offscreen qgis \
            /usr/src/project/scripts/package-qfield.py \
              /usr/src/project/signalo.qgs /usr/src/qfield-package --title "Signalo"

      - name: Verify the package
        run: |
          docker compose run --rm -e QT_QPA_PLATFORM=offscreen qgis \
            /usr/src/project/scripts/check-qfield-package.py \
              /usr/src/qfield-package/signalo.qgs

      - name: Zip the package
        run: zip -r signalo-qfield-package.zip qfield-package

      - name: Docker logs
        if: failure()
        run: docker compose logs

      - uses: actions/upload-artifact@v7
        with:
          name: signalo-qfield-package
          path: signalo-qfield-package.zip
          if-no-files-found: error

      - name: Upload QField package as GitHub Release asset
        if: ${{ inputs.release_tag != '' }}
        run: gh release upload "${{ inputs.release_tag }}" signalo-qfield-package.zip --repo "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
